# =============================================================================
# Production-style stack: PostgreSQL + API. One command to run:
#
#     docker compose up --build
#
# Secrets and DB credentials are read from the local `.env` file via
# interpolation (copy `.env.example` to `.env` first). The API container
# receives its configuration through the `environment:` block below — the
# application itself does not read a .env file at runtime.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sartho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sartho}
      POSTGRES_DB: ${POSTGRES_DB:-sartho}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sartho} -d ${POSTGRES_DB:-sartho}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # The database port is intentionally NOT published to the host by default.
    # Uncomment to connect from a local DB client:
    # ports:
    #   - "5432:5432"

  api:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      # Overrides the host-oriented DATABASE_URL from .env: inside the compose
      # network the database is reachable at the service hostname "postgres".
      DATABASE_URL: postgresql://${POSTGRES_USER:-sartho}:${POSTGRES_PASSWORD:-sartho}@postgres:5432/${POSTGRES_DB:-sartho}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required — set it in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required — set it in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    ports:
      - "3000:3000"

volumes:
  pgdata:
